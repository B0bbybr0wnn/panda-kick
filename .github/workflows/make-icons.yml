name: Make Icons

on:
  push:
    paths:
      - 'icon.svg'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsvg
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Convert
        run: |
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png

      - name: Commit back
        run: |
          git config user.name "Panda Kick Bot"
          git config user.email "bot@pandakick.app"
          git add icon-192.png icon-512.png
          git commit -m "auto: generate icon pngs" || echo "no changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
