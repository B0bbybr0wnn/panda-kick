name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias pandakick \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass PandaKick2026 \
            -keypass PandaKick2026 \
            -dname "CN=Panda Kick, OU=Apps, O=Panda, L=Lagos, ST=Lagos, C=NG"

      - name: Convert to base64
        run: |
          base64 -w 0 release.keystore > release.keystore.b64
          echo ""
          echo "==========COPY START=========="
          cat release.keystore.b64
          echo ""
          echo "==========COPY END=========="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: release.keystore.b64
          retention-days: 7
