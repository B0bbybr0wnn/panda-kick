name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html styles.css app.js icons.js manifest.json www/
          cp -r data www/
          cp -r sounds www/
          cp -r src www/ || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Init Capacitor
        run: npx cap init "Panda Kick" "com.pandakick.trivia" --web-dir www --npm-client npm

      - name: Copy capacitor config
        run: cp capacitor.config.json ./capacitor.config.json || true

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Grant gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/panda-kick.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panda-kick-apk
          path: output/panda-kick.apk
          retention-days: 30
