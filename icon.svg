<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1A1030"/>
      <stop offset="60%" stop-color="#0A0E12"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEFA0"/>
      <stop offset="35%" stop-color="#FFD84D"/>
      <stop offset="70%" stop-color="#E0B420"/>
      <stop offset="100%" stop-color="#B08A10"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFD84D" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="220" fill="url(#glow)"/>

  <g opacity="0.06" stroke="#F5F7FA" stroke-width="2" fill="none">
    <line x1="0" y1="256" x2="512" y2="256"/>
    <circle cx="256" cy="256" r="90"/>
  </g>

  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#FFD84D" stroke-width="2" opacity="0.35"/>

  <g filter="url(#goldShadow)">
    <text x="256" y="330"
      text-anchor="middle"
      font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
      font-size="260"
      font-weight="900"
      letter-spacing="-6"
      fill="url(#goldGrad)"
      stroke="#8A6E0F"
      stroke-width="1.5"
      paint-order="stroke"
      >PK</text>
  </g>

  <g opacity="0.5">
    <text x="256" y="320"
      text-anchor="middle"
      font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
      font-size="260"
      font-weight="900"
      letter-spacing="-6"
      fill="url(#shine)"
      clip-path="inset(0 0 55% 0)"
      >PK</text>
  </g>

  <g transform="translate(400 400)" opacity="0.9">
    <circle cx="0" cy="0" r="34" fill="#0A0E12" stroke="#FFD84D" stroke-width="2.5"/>
    <path d="M0 -18 L17 -6 L11 15 L-11 15 L-17 -6 Z" fill="#FFD84D"/>
    <g stroke="#FFD84D" stroke-width="2" stroke-linecap="round" fill="none">
      <line x1="0" y1="-18" x2="0" y2="-30"/>
      <line x1="17" y1="-6" x2="28" y2="-12"/>
      <line x1="11" y1="15" x2="18" y2="28"/>
      <line x1="-11" y1="15" x2="-18" y2="28"/>
      <line x1="-17" y1="-6" x2="-28" y2="-12"/>
    </g>
  </g>

  <rect x="156" y="360" width="200" height="3" rx="1.5" fill="url(#goldGrad)" opacity="0.7"/>
</svg>
